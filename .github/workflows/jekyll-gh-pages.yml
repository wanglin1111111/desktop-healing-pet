concurrency:
  group: "pages"
  cancel-in-progress: false 取消中: false

jobs:作业:
  # Build job# 构建作业
  build:  构建:
    runs-on: ubuntu-latest    运行平台: ubuntu-latest    运行平台: ubuntu-latest
    steps:    步骤:
      - name: Checkout名称: 检出代码
        uses: actions/checkout@v4        用途: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
