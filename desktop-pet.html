<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☁️ 云朵猫咪 - 桌面治愈宠物</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    cursor: default; user-select: none;
    transition: background 1.5s ease;
  }

  /* ===== 动态场景背景系统 ===== */
  body.scene-default { background: linear-gradient(135deg, #e8f4f8 0%, #d4eaf7 30%, #f0e6ff 60%, #fce4ec 100%); }
  body.scene-starry { background: linear-gradient(180deg, #0a0e27 0%, #1a1a4e 40%, #2d1b69 70%, #1a1040 100%); }
  body.scene-ocean { background: linear-gradient(180deg, #1a3a5c 0%, #2a6496 30%, #3a8fd4 60%, #1a4a7a 100%); }
  body.scene-rain { background: linear-gradient(180deg, #4a5568 0%, #6b7b8d 30%, #8899aa 60%, #5a6a7a 100%); }
  body.scene-forest { background: linear-gradient(180deg, #1a3a1a 0%, #2d5a27 30%, #4a8c3f 60%, #2d6b22 100%); }
  body.scene-sunset { background: linear-gradient(180deg, #1a0a2e 0%, #6b2fa0 20%, #d4553a 50%, #f0a030 70%, #ffd080 100%); }
  body.scene-sakura { background: linear-gradient(180deg, #fce4ec 0%, #f8bbd0 30%, #f48fb1 60%, #ec407a 100%); }
  body.scene-snow { background: linear-gradient(180deg, #e8eef5 0%, #c5d5e8 30%, #a8c0d8 60%, #d0e0f0 100%); }

  /* 场景粒子容器 */
  .scene-particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

  /* 星星 */
  .star { position: fixed; border-radius: 50%; background: white; pointer-events: none; animation: twinkle var(--dur) ease-in-out infinite; animation-delay: var(--delay); }
  @keyframes twinkle { 0%,100%{opacity:0.2;transform:scale(0.8);}50%{opacity:1;transform:scale(1.2);} }

  /* 波浪 */
  .wave-container { position: fixed; bottom: 0; left: 0; width: 100%; height: 120px; pointer-events: none; z-index: 1; overflow: hidden; }
  .wave-container .wave { position: absolute; bottom: 0; width: 200%; height: 100%; border-radius: 40% 45% 0 0; animation: waveMove var(--dur) linear infinite; }
  .wave-container .wave:nth-child(1) { background: rgba(58,143,212,0.3); --dur: 7s; bottom: -10px; }
  .wave-container .wave:nth-child(2) { background: rgba(42,100,150,0.25); --dur: 9s; bottom: -20px; animation-delay: -2s; }
  .wave-container .wave:nth-child(3) { background: rgba(26,74,122,0.2); --dur: 11s; bottom: -30px; animation-delay: -4s; }
  @keyframes waveMove { 0%{transform:translateX(0);}100%{transform:translateX(-50%);} }

  /* 雨滴 */
  .rain-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
  .raindrop { position: absolute; top: -20px; width: 2px; background: linear-gradient(transparent, rgba(174,194,224,0.6)); animation: rainFall var(--dur) linear infinite; animation-delay: var(--delay); }
  @keyframes rainFall { 0%{transform:translateY(-20px);opacity:0.7;}100%{transform:translateY(100vh);opacity:0.3;} }

  /* 树叶 */
  .leaf { position: fixed; top: -30px; pointer-events: none; z-index: 1; animation: leafFall var(--dur) linear infinite; animation-delay: var(--delay); font-size: var(--size); opacity: 0.7; }
  @keyframes leafFall { 0%{transform:translateY(-30px) rotate(0deg) translateX(0);opacity:0.7;}25%{transform:translateY(25vh) rotate(90deg) translateX(30px);}50%{transform:translateY(50vh) rotate(180deg) translateX(-20px);}75%{transform:translateY(75vh) rotate(270deg) translateX(25px);}100%{transform:translateY(100vh) rotate(360deg) translateX(0);opacity:0;} }

  /* 日落光晕 */
  .sunset-glow { position: fixed; bottom: 20%; left: 50%; transform: translateX(-50%); width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(255,160,48,0.4) 0%, rgba(255,100,50,0.2) 40%, transparent 70%); pointer-events: none; z-index: 1; animation: sunsetPulse 4s ease-in-out infinite; }
  @keyframes sunsetPulse { 0%,100%{transform:translateX(-50%) scale(1);opacity:0.8;}50%{transform:translateX(-50%) scale(1.15);opacity:1;} }

  /* 花瓣 */
  .petal { position: fixed; top: -20px; pointer-events: none; z-index: 1; width: var(--size); height: var(--size); background: radial-gradient(ellipse, rgba(255,255,255,0.8) 0%, rgba(248,187,208,0.6) 100%); border-radius: 50% 0 50% 50%; animation: petalFall var(--dur) linear infinite; animation-delay: var(--delay); }
  @keyframes petalFall { 0%{transform:translateY(-20px) rotate(0deg) translateX(0);opacity:0.8;}33%{transform:translateY(33vh) rotate(120deg) translateX(40px);}66%{transform:translateY(66vh) rotate(240deg) translateX(-30px);}100%{transform:translateY(100vh) rotate(360deg) translateX(20px);opacity:0;} }

  /* 雪花 */
  .snowflake { position: fixed; top: -10px; pointer-events: none; z-index: 1; width: var(--size); height: var(--size); background: white; border-radius: 50%; opacity: 0.8; animation: snowFall var(--dur) linear infinite; animation-delay: var(--delay); }
  @keyframes snowFall { 0%{transform:translateY(-10px) translateX(0) rotate(0deg);opacity:0.8;}25%{transform:translateY(25vh) translateX(15px) rotate(90deg);}50%{transform:translateY(50vh) translateX(-10px) rotate(180deg);}75%{transform:translateY(75vh) translateX(20px) rotate(270deg);}100%{transform:translateY(100vh) translateX(5px) rotate(360deg);opacity:0.3;} }

  /* 默认浮动粒子 */
  .bg-particle { position: fixed; border-radius: 50%; pointer-events: none; opacity: 0.3; animation: floatP linear infinite; }
  @keyframes floatP { 0%{transform:translateY(100vh) rotate(0deg);opacity:0;}10%{opacity:0.3;}90%{opacity:0.3;}100%{transform:translateY(-10vh) rotate(360deg);opacity:0;} }

  /* ===== 情绪光环系统 ===== */
  .emotion-aura { position: absolute; width: 220px; height: 220px; top: -20px; left: -20px; border-radius: 50%; pointer-events: none; z-index: 0; transition: all 1s ease; opacity: 0; }
  .emotion-aura.active { opacity: 1; }
  .emotion-aura.aura-happy { background: radial-gradient(circle, rgba(255,200,50,0.3) 0%, rgba(255,180,0,0.1) 40%, transparent 70%); animation: auraGlow 2s ease-in-out infinite; }
  .emotion-aura.aura-sad { background: radial-gradient(circle, rgba(100,150,255,0.25) 0%, rgba(80,120,200,0.1) 40%, transparent 70%); animation: auraGlow 3s ease-in-out infinite; }
  .emotion-aura.aura-comfort { background: radial-gradient(circle, rgba(255,150,200,0.3) 0%, rgba(255,100,150,0.1) 40%, transparent 70%); animation: auraExpand 2.5s ease-in-out infinite; }
  .emotion-aura.aura-excited { background: radial-gradient(circle, rgba(255,100,100,0.2) 0%, rgba(100,200,255,0.15) 40%, rgba(255,200,100,0.1) 60%, transparent 70%); animation: auraBurst 1.5s ease-in-out infinite; }
  .emotion-aura.aura-calm { background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, rgba(220,230,255,0.1) 40%, transparent 70%); animation: auraBreathe 3s ease-in-out infinite; }
  @keyframes auraGlow { 0%,100%{transform:scale(1);opacity:0.7;}50%{transform:scale(1.1);opacity:1;} }
  @keyframes auraExpand { 0%,100%{transform:scale(1);opacity:0.6;}50%{transform:scale(1.2);opacity:1;} }
  @keyframes auraBurst { 0%,100%{transform:scale(1) rotate(0deg);opacity:0.6;}50%{transform:scale(1.15) rotate(10deg);opacity:1;} }
  @keyframes auraBreathe { 0%,100%{transform:scale(0.95);opacity:0.4;}50%{transform:scale(1.1);opacity:0.8;} }

  /* 情绪粒子 */
  .emotion-particle { position: absolute; pointer-events: none; z-index: 10; border-radius: 50%; animation: emotionPF 2s ease-out forwards; }
  @keyframes emotionPF { 0%{opacity:1;transform:translate(0,0) scale(0.5);}50%{opacity:1;transform:translate(var(--dx),var(--dy)) scale(1);}100%{opacity:0;transform:translate(var(--dx2),var(--dy2)) scale(0.6);} }

  /* ===== 宠物容器 ===== */
  #pet-container { position: absolute; width: 180px; height: 200px; cursor: grab; transition: filter 0.3s; z-index: 100; }
  #pet-container:active { cursor: grabbing; }
  #pet-container:hover { filter: brightness(1.05) drop-shadow(0 0 15px rgba(135,206,235,0.5)); }
  .pet-body { position: relative; width: 180px; height: 180px; }
  .pet-main-body { position: absolute; width: 130px; height: 110px; background: radial-gradient(ellipse at 50% 60%, #b8e8f0 0%, #87ceeb 40%, #6bb8d6 100%); border-radius: 50% 50% 48% 48%; left: 25px; top: 50px; box-shadow: inset 0 -10px 20px rgba(100,180,210,0.3), 0 8px 25px rgba(100,180,210,0.4), 0 0 40px rgba(135,206,235,0.2); animation: bodyBreathe 3s ease-in-out infinite; }
  @keyframes bodyBreathe { 0%,100%{transform:scaleY(1) scaleX(1);}50%{transform:scaleY(1.03) scaleX(1.02);} }
  .pet-head { position: absolute; width: 120px; height: 100px; background: radial-gradient(ellipse at 50% 55%, #c5eef5 0%, #93d5e8 40%, #7ec8dd 100%); border-radius: 50% 50% 45% 45%; left: 30px; top: 15px; box-shadow: inset 0 -8px 15px rgba(100,180,210,0.2), 0 4px 15px rgba(100,180,210,0.3); animation: headBob 2.5s ease-in-out infinite; z-index: 2; transition: transform 0.3s ease; }
  @keyframes headBob { 0%,100%{transform:translateY(0) rotate(0deg);}25%{transform:translateY(-3px) rotate(-2deg);}75%{transform:translateY(-1px) rotate(1deg);} }
  @keyframes headTiltL { 0%,100%{transform:rotate(0deg);}50%{transform:rotate(-12deg) translateY(-2px);} }
  @keyframes headTiltR { 0%,100%{transform:rotate(0deg);}50%{transform:rotate(12deg) translateY(-2px);} }
  @keyframes headNod { 0%,100%{transform:translateY(0) rotate(0deg);}30%{transform:translateY(4px) rotate(-3deg);}60%{transform:translateY(-2px) rotate(2deg);} }
  @keyframes headShake { 0%,100%{transform:rotate(0deg);}20%{transform:rotate(-8deg);}40%{transform:rotate(8deg);}60%{transform:rotate(-5deg);}80%{transform:rotate(5deg);} }
  @keyframes headThink { 0%,100%{transform:rotate(0deg) translateY(0);}50%{transform:rotate(-10deg) translateY(-3px);} }

  .pet-ear-left, .pet-ear-right { position: absolute; width: 35px; height: 45px; background: radial-gradient(ellipse at 50% 70%, #93d5e8 0%, #7ec8dd 100%); z-index: 1; }
  .pet-ear-left { left:28px; top:-8px; border-radius:50% 50% 20% 20%; transform:rotate(-15deg); animation:earL 4s ease-in-out infinite; }
  .pet-ear-right { right:28px; top:-8px; border-radius:50% 50% 20% 20%; transform:rotate(15deg); animation:earR 5s ease-in-out infinite; }
  .pet-ear-left::after, .pet-ear-right::after { content:''; position:absolute; width:20px; height:28px; background:radial-gradient(ellipse,#ffd4b8 0%,#ffb89e 100%); border-radius:50% 50% 20% 20%; top:8px; left:7px; }
  @keyframes earL { 0%,90%,100%{transform:rotate(-15deg);}93%{transform:rotate(-22deg);}96%{transform:rotate(-12deg);} }
  @keyframes earR { 0%,85%,100%{transform:rotate(15deg);}88%{transform:rotate(22deg);}91%{transform:rotate(12deg);} }
  @keyframes earPerkL { 0%,100%{transform:rotate(-15deg);}50%{transform:rotate(-25deg);} }
  @keyframes earPerkR { 0%,100%{transform:rotate(15deg);}50%{transform:rotate(25deg);} }
  @keyframes earThinkL { 0%,100%{transform:rotate(-15deg);}30%{transform:rotate(-28deg);}60%{transform:rotate(-10deg);} }
  @keyframes earThinkR { 0%,100%{transform:rotate(15deg);}30%{transform:rotate(25deg);}60%{transform:rotate(8deg);} }

  .pet-eyes { position:absolute; top:38px; left:50%; transform:translateX(-50%); display:flex; gap:22px; z-index:3; }
  .pet-eye { width:22px; height:22px; position:relative; }
  .pet-eye .eye-open { width:22px; height:22px; background:radial-gradient(circle at 45% 40%,#4dd9e8 0%,#2ab8c9 50%,#1a9aad 100%); border-radius:50%; position:relative; box-shadow:0 0 8px rgba(77,217,232,0.5); display:none; }
  .pet-eye .eye-open::before { content:''; position:absolute; width:8px; height:8px; background:white; border-radius:50%; top:4px; left:5px; }
  .pet-eye .eye-open::after { content:''; position:absolute; width:4px; height:4px; background:rgba(255,255,255,0.7); border-radius:50%; bottom:5px; right:4px; }
  .pet-eye .eye-happy { width:18px; height:10px; border-bottom:3px solid #1a9aad; border-radius:0 0 50% 50%; position:absolute; top:8px; left:2px; }
  .pet-eye .eye-sleepy { width:18px; height:3px; background:#1a9aad; border-radius:2px; position:absolute; top:12px; left:2px; display:none; }
  .pet-eye .eye-love { width:16px; height:16px; position:absolute; top:5px; left:3px; display:none; font-size:14px; line-height:1; }
  .pet-eye .eye-sad { width:18px; height:8px; border-bottom:3px solid #1a9aad; border-radius:0 0 50% 50%; position:absolute; top:10px; left:2px; display:none; opacity:0.7; }
  .pet-eye .eye-sparkle { width:22px; height:22px; background:radial-gradient(circle at 45% 40%,#4dd9e8 0%,#2ab8c9 50%,#1a9aad 100%); border-radius:50%; position:relative; box-shadow:0 0 12px rgba(77,217,232,0.8); display:none; }
  .pet-eye .eye-sparkle::before { content:'✦'; position:absolute; width:10px; height:10px; color:white; font-size:10px; top:3px; left:4px; }
  .pet-eye .eye-sparkle::after { content:'✦'; position:absolute; width:6px; height:6px; color:rgba(255,255,255,0.7); font-size:6px; bottom:4px; right:3px; }
  .pet-eye.blinking .eye-happy { animation:blink 0.15s ease-in-out; }
  @keyframes blink { 0%,100%{transform:scaleY(1);}50%{transform:scaleY(0.1);} }

  .pet-blush-left, .pet-blush-right { position:absolute; width:18px; height:12px; background:radial-gradient(ellipse,rgba(255,150,150,0.5) 0%,rgba(255,150,150,0) 100%); border-radius:50%; top:52px; z-index:3; transition:all 0.3s; }
  .pet-blush-left { left:18px; } .pet-blush-right { right:18px; }
  #pet-container.blushing .pet-blush-left, #pet-container.blushing .pet-blush-right { width:22px; height:15px; background:radial-gradient(ellipse,rgba(255,120,120,0.7) 0%,rgba(255,150,150,0) 100%); }
  .pet-nose { position:absolute; width:8px; height:6px; background:#7ec8dd; border-radius:50% 50% 50% 50%/30% 30% 70% 70%; top:55px; left:50%; transform:translateX(-50%); z-index:3; }
  .pet-mouth { position:absolute; top:60px; left:50%; transform:translateX(-50%); z-index:3; }
  .pet-mouth .m-happy { width:14px; height:8px; border-bottom:2.5px solid #5aabb8; border-radius:0 0 50% 50%; }
  .pet-mouth .m-eating { width:12px; height:10px; background:#5aabb8; border-radius:50%; display:none; animation:mEat 0.3s ease-in-out infinite; }
  .pet-mouth .m-open { width:16px; height:12px; background:radial-gradient(ellipse,#5aabb8 0%,#4a9aa8 100%); border-radius:50% 50% 50% 50%/40% 40% 60% 60%; display:none; }
  .pet-mouth .m-open::after { content:''; position:absolute; width:8px; height:5px; background:#ffb89e; border-radius:0 0 50% 50%; bottom:1px; left:4px; }
  .pet-mouth .m-excited { width:20px; height:16px; background:radial-gradient(ellipse,#5aabb8 0%,#4a9aa8 100%); border-radius:50%; display:none; animation:mExc 0.4s ease-in-out infinite; }
  .pet-mouth .m-excited::after { content:''; position:absolute; width:10px; height:6px; background:#ffb89e; border-radius:0 0 50% 50%; bottom:1px; left:5px; }
  .pet-mouth .m-sad { width:12px; height:6px; border-top:2.5px solid #5aabb8; border-radius:50% 50% 0 0; display:none; }
  .pet-mouth .m-meow { width:10px; height:10px; background:radial-gradient(ellipse,#5aabb8 0%,#4a9aa8 100%); border-radius:50%; display:none; animation:mMeow 0.6s ease-in-out infinite; }
  @keyframes mEat { 0%,100%{transform:scaleY(1);}50%{transform:scaleY(0.5);} }
  @keyframes mExc { 0%,100%{transform:scaleY(1) scaleX(1);}50%{transform:scaleY(1.15) scaleX(1.1);} }
  @keyframes mMeow { 0%,100%{transform:scale(1);}50%{transform:scale(1.2);} }
  .pet-whiskers { position:absolute; top:52px; left:50%; transform:translateX(-50%); z-index:3; width:120px; }
  .whisker { position:absolute; width:28px; height:1.5px; background:rgba(255,255,255,0.6); border-radius:1px; }
  .whisker.l1{left:2px;top:0;transform:rotate(-8deg);} .whisker.l2{left:0;top:8px;transform:rotate(3deg);} .whisker.l3{left:2px;top:16px;transform:rotate(12deg);}
  .whisker.r1{right:2px;top:0;transform:rotate(8deg);} .whisker.r2{right:0;top:8px;transform:rotate(-3deg);} .whisker.r3{right:2px;top:16px;transform:rotate(-12deg);}
  #pet-container.sad-w .whisker.l1{transform:rotate(5deg);} #pet-container.sad-w .whisker.l3{transform:rotate(18deg);}
  #pet-container.sad-w .whisker.r1{transform:rotate(-5deg);} #pet-container.sad-w .whisker.r3{transform:rotate(-18deg);}

  .pet-paw-left, .pet-paw-right { position:absolute; width:30px; height:22px; background:radial-gradient(ellipse at 50% 60%,#c5eef5 0%,#a8dce8 100%); border-radius:50% 50% 45% 45%; bottom:8px; z-index:4; box-shadow:0 3px 8px rgba(100,180,210,0.3); }
  .pet-paw-left{left:35px;} .pet-paw-right{right:35px;}
  .pet-paw-left::after, .pet-paw-right::after { content:''; position:absolute; width:16px; height:10px; background:radial-gradient(ellipse,#ffd4b8 0%,rgba(255,212,184,0.5) 100%); border-radius:50%; bottom:2px; left:7px; }
  @keyframes pawWave { 0%,100%{transform:rotate(0deg) translateY(0);}25%{transform:rotate(-20deg) translateY(-15px);}50%{transform:rotate(-10deg) translateY(-20px);}75%{transform:rotate(-25deg) translateY(-12px);} }
  #pet-container.waving .pet-paw-right { animation:pawWave 0.6s ease-in-out 3; transform-origin:top center; }
  @keyframes pawBeg { 0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);} }
  #pet-container.begging .pet-paw-left, #pet-container.begging .pet-paw-right { animation:pawBeg 0.5s ease-in-out infinite; }

  .pet-tail { position:absolute; width:60px; height:50px; border:8px solid transparent; border-right:8px solid #93d5e8; border-top:8px solid #93d5e8; border-radius:0 50% 0 0; right:-10px; bottom:30px; z-index:0; animation:tailW 2s ease-in-out infinite; transform-origin:left bottom; }
  @keyframes tailW { 0%,100%{transform:rotate(-10deg);}50%{transform:rotate(15deg);} }
  @keyframes tailWF { 0%,100%{transform:rotate(-15deg);}50%{transform:rotate(20deg);} }
  #pet-container.happy-t .pet-tail { animation:tailWF 0.4s ease-in-out infinite; }
  @keyframes tailWS { 0%,100%{transform:rotate(-5deg);}50%{transform:rotate(5deg);} }
  #pet-container.sad-t .pet-tail { animation:tailWS 3s ease-in-out infinite; }
  .pet-glow { position:absolute; width:40px; height:40px; background:radial-gradient(circle,rgba(255,220,150,0.4) 0%,rgba(255,220,150,0) 70%); border-radius:50%; top:85px; left:70px; z-index:3; animation:glowP 3s ease-in-out infinite; }
  @keyframes glowP { 0%,100%{transform:scale(1);opacity:0.6;}50%{transform:scale(1.3);opacity:1;} }
  .pet-shadow { position:absolute; width:100px; height:20px; background:radial-gradient(ellipse,rgba(100,180,210,0.25) 0%,rgba(100,180,210,0) 70%); border-radius:50%; bottom:-5px; left:40px; animation:shP 3s ease-in-out infinite; }
  @keyframes shP { 0%,100%{transform:scaleX(1);opacity:0.6;}50%{transform:scaleX(1.1);opacity:0.8;} }

  /* ===== 新增宠物姿态动画 ===== */
  #pet-container.sitting .pet-main-body { animation: sitBody 0.5s ease forwards; }
  @keyframes sitBody { 0%{transform:scaleY(1);}100%{transform:scaleY(0.85) scaleX(1.05);} }
  #pet-container.sitting .pet-paw-left { transform: translateX(10px); }
  #pet-container.sitting .pet-paw-right { transform: translateX(-10px); }

  #pet-container.lying .pet-main-body { animation: lieBody 0.6s ease forwards; }
  @keyframes lieBody { 0%{transform:scaleY(1);}100%{transform:scaleY(0.6) scaleX(1.15);} }
  #pet-container.lying .pet-head { animation: lieHead 0.6s ease forwards; }
  @keyframes lieHead { 0%{transform:translateY(0);}100%{transform:translateY(15px) rotate(5deg);} }
  #pet-container.lying .pet-paw-left { transform: translateX(15px) translateY(5px); }
  #pet-container.lying .pet-paw-right { transform: translateX(-15px) translateY(5px); }

  #pet-container.snuggling .pet-body { animation: snuggleBody 2s ease-in-out infinite; }
  @keyframes snuggleBody { 0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);} }
  #pet-container.snuggling .pet-tail { animation: tailWF 1s ease-in-out infinite; }

  #pet-container.rolling .pet-body { animation: rollBody 0.8s ease-in-out 2; }
  @keyframes rollBody { 0%{transform:rotate(0deg);}25%{transform:rotate(15deg);}50%{transform:rotate(0deg);}75%{transform:rotate(-15deg);}100%{transform:rotate(0deg);} }

  #pet-container.stretching .pet-main-body { animation: stretchBody 1.5s ease-in-out forwards; }
  @keyframes stretchBody { 0%{transform:scaleY(1) scaleX(1);}30%{transform:scaleY(0.9) scaleX(1.2);}60%{transform:scaleY(1.1) scaleX(0.95);}100%{transform:scaleY(1) scaleX(1);} }
  #pet-container.stretching .pet-paw-left { animation: stretchPaw 1.5s ease-in-out forwards; }
  #pet-container.stretching .pet-paw-right { animation: stretchPawR 1.5s ease-in-out forwards; }

<script>

document.addEventListener('mousedown',e=>{const r=document.createElement('div');r.className='touch-ripple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),800);});

// =============================================
// ===== 动态场景背景系统 =====
// =============================================
let currentBg = 'default';
let sceneParticles = [];
const SP = document.getElementById('scene-particles');

function switchBg(scene, btn) {
  if (scene === currentBg) return;
  currentBg = scene;
  document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.body.className = 'scene-' + scene;
  clearSceneParticles();
  createSceneParticles(scene);
  playSceneSound(scene);
  setScenePose(scene);
  const names = {default:'天空',starry:'星空',ocean:'海洋',rain:'雨天',forest:'森林',sunset:'日落',sakura:'樱花',snow:'雪天'};
  addMsg('system', '场景已切换到' + (names[scene]||scene) + '~');
}

function clearSceneParticles() {
  sceneParticles.forEach(p => { if(p && p.parentNode) p.parentNode.removeChild(p); });
  sceneParticles = [];
  const wc = document.querySelector('.wave-container'); if(wc) wc.remove();
  const rc = document.querySelector('.rain-container'); if(rc) rc.remove();
  const sg = document.querySelector('.sunset-glow'); if(sg) sg.remove();
}

function createSceneParticles(scene) {
  switch(scene) {
    case 'starry':
      for (let i = 0; i < 60; i++) {
        const star = document.createElement('div'); star.className = 'star';
        const size = Math.random()*3+1; star.style.width=size+'px'; star.style.height=size+'px';
        star.style.left=Math.random()*100+'vw'; star.style.top=Math.random()*70+'vh';
        star.style.setProperty('--dur',(Math.random()*3+1.5)+'s');
        star.style.setProperty('--delay',(Math.random()*3)+'s');
        SP.appendChild(star); sceneParticles.push(star);
      } break;
    case 'ocean':
      const waveCont = document.createElement('div'); waveCont.className = 'wave-container';
      for (let i=0;i<3;i++){const w=document.createElement('div');w.className='wave';waveCont.appendChild(w);}
      document.body.appendChild(waveCont);
      for (let i=0;i<15;i++){const b=document.createElement('div');b.className='bg-particle';const s=Math.random()*6+2;b.style.width=s+'px';b.style.height=s+'px';b.style.left=Math.random()*100+'vw';b.style.background='rgba(255,255,255,0.5)';b.style.animationDuration=(Math.random()*10+8)+'s';b.style.animationDelay=(Math.random()*8)+'s';SP.appendChild(b);sceneParticles.push(b);}
      break;
    case 'rain':
      const rainCont = document.createElement('div'); rainCont.className = 'rain-container';
      for (let i=0;i<80;i++){const d=document.createElement('div');d.className='raindrop';d.style.left=Math.random()*100+'%';d.style.height=(Math.random()*20+10)+'px';d.style.setProperty('--dur',(Math.random()*0.5+0.5)+'s');d.style.setProperty('--delay',(Math.random()*2)+'s');rainCont.appendChild(d);}
      document.body.appendChild(rainCont); break;
    case 'forest':
      for (let i=0;i<20;i++){const l=document.createElement('div');l.className='leaf';l.textContent=['🍃','🌿','🍂'][~~(Math.random()*3)];l.style.left=Math.random()*100+'vw';l.style.setProperty('--dur',(Math.random()*8+6)+'s');l.style.setProperty('--delay',(Math.random()*8)+'s');l.style.setProperty('--size',(Math.random()*10+14)+'px');SP.appendChild(l);sceneParticles.push(l);}
      break;
    case 'sunset':
      const glow=document.createElement('div');glow.className='sunset-glow';document.body.appendChild(glow);
      for (let i=0;i<10;i++){const p=document.createElement('div');p.className='bg-particle';const s=Math.random()*6+3;p.style.width=s+'px';p.style.height=s+'px';p.style.left=Math.random()*100+'vw';p.style.background=['rgba(255,160,48,0.5)','rgba(255,100,50,0.4)','rgba(255,200,100,0.4)'][~~(Math.random()*3)];p.style.animationDuration=(Math.random()*12+8)+'s';p.style.animationDelay=(Math.random()*8)+'s';SP.appendChild(p);sceneParticles.push(p);}
      break;
    case 'sakura':
      for (let i=0;i<25;i++){const p=document.createElement('div');p.className='petal';p.style.left=Math.random()*100+'vw';p.style.setProperty('--dur',(Math.random()*6+5)+'s');p.style.setProperty('--delay',(Math.random()*6)+'s');p.style.setProperty('--size',(Math.random()*8+6)+'px');SP.appendChild(p);sceneParticles.push(p);}
      break;
    case 'snow':
      for (let i=0;i<40;i++){const f=document.createElement('div');f.className='snowflake';f.style.left=Math.random()*100+'vw';f.style.setProperty('--dur',(Math.random()*6+4)+'s');f.style.setProperty('--delay',(Math.random()*6)+'s');f.style.setProperty('--size',(Math.random()*5+3)+'px');SP.appendChild(f);sceneParticles.push(f);}
      break;
  }
}

function setScenePose(scene) {
  if (pet.state==='sleeping') return;
  clearMod();
  switch(scene) {
    case 'starry': C.classList.add('lying'); setExpr('sleepy'); showBubble('哇...星星好美喵~'); break;
    case 'rain': C.classList.add('snuggling'); setExpr('sad'); showBubble('下雨了...过来让我靠靠~'); break;
    case 'forest': C.classList.add('listening'); setExpr('open'); showBubble('好多树呀! 好新奇喵~'); break;
    case 'ocean': C.classList.add('happy-t'); setExpr('sparkle'); showBubble('大海! 好想玩水喵~'); break;
    case 'sunset': setExpr('sleepy'); showBubble('夕阳好美...好温暖喵~'); break;
    case 'sakura': C.classList.add('happy-t','blushing'); setExpr('love'); showBubble('好漂亮的花! 喵~'); break;
    case 'snow': C.classList.add('listening'); setExpr('open'); showBubble('雪! 好冷但好漂亮喵~'); break;
    default: setExpr('happy'); break;
  }
  setTimeout(()=>{if(pet.state!=='sleeping'){clearMod();setState('idle');}},3000);
}

// =============================================
// ===== 情境音效系统（Web Audio API）=====
// =============================================
let audioCtx = null;
let soundEnabled = true;
let currentSoundNodes = [];

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function stopAllSounds() {
  currentSoundNodes.forEach(n => { try{n.stop?n.stop():n.disconnect();}catch(e){} });
  currentSoundNodes = [];
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('sound-toggle');
  btn.textContent = soundEnabled ? '🔊' : '🔇';
  btn.classList.toggle('muted', !soundEnabled);
  if (!soundEnabled) stopAllSounds();
}

function playSceneSound(scene) {
  if (!soundEnabled) return;
  initAudio(); stopAllSounds();
  switch(scene) {
    case 'forest': playBirdSound(); break;
    case 'rain': playRainSound(); break;
    case 'ocean': playWaveSound(); break;
    case 'starry': playCricketSound(); break;
    case 'snow': case 'sunset': case 'sakura': playWindSound(); break;
  }
}

// 鸟鸣（森林）
function playBirdSound() {
  if (!audioCtx||!soundEnabled) return;
  const chirp = () => {
    if (!soundEnabled||currentBg!=='forest') return;
    const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination); osc.type='sine';
    const bf=2000+Math.random()*2000;
    osc.frequency.setValueAtTime(bf,audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(bf*1.5,audioCtx.currentTime+0.1);
    osc.frequency.exponentialRampToValueAtTime(bf*0.8,audioCtx.currentTime+0.2);
    gain.gain.setValueAtTime(0,audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.03,audioCtx.currentTime+0.05);
    gain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.25);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime+0.3);
    currentSoundNodes.push(osc);
    setTimeout(chirp, 800+Math.random()*2000);
  }; chirp();
}

// 雨声（白噪声）
function playRainSound() {
  if (!audioCtx||!soundEnabled) return;
  const bs=audioCtx.sampleRate*2, buf=audioCtx.createBuffer(1,bs,audioCtx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<bs;i++) d[i]=Math.random()*2-1;
  const src=audioCtx.createBufferSource(); src.buffer=buf; src.loop=true;
  const flt=audioCtx.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=800;
  const g=audioCtx.createGain(); g.gain.value=0.06;
  src.connect(flt); flt.connect(g); g.connect(audioCtx.destination); src.start();
  currentSoundNodes.push(src);
}

// 海浪（低频振荡+白噪声）
function playWaveSound() {
  if (!audioCtx||!soundEnabled) return;
  const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
  osc.type='sine'; osc.frequency.value=0.15; g.gain.value=0;
  osc.connect(g); g.connect(audioCtx.destination);
  const lfo=audioCtx.createOscillator(), lg=audioCtx.createGain();
  lfo.frequency.value=0.1; lg.gain.value=0.04;
  lfo.connect(lg); lg.connect(g.gain); lfo.start(); osc.start();
  currentSoundNodes.push(osc,lfo);
  const bs=audioCtx.sampleRate*2, buf=audioCtx.createBuffer(1,bs,audioCtx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<bs;i++) d[i]=Math.random()*2-1;
  const n=audioCtx.createBufferSource(); n.buffer=buf; n.loop=true;
  const nf=audioCtx.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=400;
  const ng=audioCtx.createGain(); ng.gain.value=0.04;
  n.connect(nf); nf.connect(ng); ng.connect(audioCtx.destination); n.start();
  currentSoundNodes.push(n);
}

// 虫鸣（高频振荡）
function playCricketSound() {
  if (!audioCtx||!soundEnabled) return;
  const chirp = () => {
    if (!soundEnabled||currentBg!=='starry') return;
    const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
    osc.connect(g); g.connect(audioCtx.destination); osc.type='sine';
    osc.frequency.value=4000+Math.random()*1000;
    g.gain.setValueAtTime(0,audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.02,audioCtx.currentTime+0.02);
    for(let i=0;i<6;i++){g.gain.setValueAtTime(0.02,audioCtx.currentTime+0.02+i*0.06);g.gain.setValueAtTime(0,audioCtx.currentTime+0.02+i*0.06+0.03);}
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime+0.5);
    currentSoundNodes.push(osc);
    setTimeout(chirp, 1500+Math.random()*3000);
  }; chirp();
}

// 风声（滤波白噪声）
function playWindSound() {
  if (!audioCtx||!soundEnabled) return;
  const bs=audioCtx.sampleRate*2, buf=audioCtx.createBuffer(1,bs,audioCtx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<bs;i++) d[i]=Math.random()*2-1;
  const src=audioCtx.createBufferSource(); src.buffer=buf; src.loop=true;
  const flt=audioCtx.createBiquadFilter(); flt.type='bandpass'; flt.frequency.value=300; flt.Q.value=0.5;
  const g=audioCtx.createGain(); g.gain.value=0.03;
  src.connect(flt); flt.connect(g); g.connect(audioCtx.destination); src.start();
  currentSoundNodes.push(src);
}

// =============================================
// ===== 情绪光环系统 =====
// =============================================
let emotionAuraTimer = null;

const emotionKeywords = {
  happy: ['开心','高兴','快乐','幸福','棒','太好了','哈哈','嘻嘻','耶','喜欢','爱','好棒','真棒','最棒','好萌','萌','可爱','成功','赢了','通过','完成','惊喜','兴奋','满足','感动','温暖','甜蜜','笑','庆祝','生日','派对','礼物'],
  sad: ['难过','伤心','不开心','哭','难受','郁闷','烦','累','辛苦','失望','失败','做不好','搞砸','出错','吵架','争吵','分手','孤独','寂寞','焦虑','害怕','委屈','痛苦','绝望','崩溃','不被理解','没人懂','讨厌自己','恨自己','想哭','忍不住','撑不住','好难','不公平','失去','去世','欺负','嘲笑'],
  comfort: ['没关系','别担心','放心','会好的','陪你','拥抱','温暖','安慰','谢谢你','感谢','有你真好','好多了','好一点','谢谢小云朵','理解','支持','鼓励'],
  excited: ['哇','太厉害了','不可思议','震惊','惊喜','天哪','厉害','牛','酷','帅','牛啊','太强了','超级','无敌','绝了','神了','逆天','好嗨','好激动'],
  calm: ['安静','平静','放松','舒服','惬意','悠闲','宁静','淡然','从容','安心','踏实','祥和','冥想','呼吸']
};

function detectEmotion(text) {
  const tl=text.toLowerCase(); let maxCount=0, detected=null;
  for (const [emotion,keywords] of Object.entries(emotionKeywords)) {
    const count=keywords.filter(w=>tl.includes(w)).length;
    if(count>maxCount){maxCount=count;detected=emotion;}
  }
  return detected;
}

function showEmotionAura(emotion) {
  if(!emotion){hideEmotionAura();return;}
  EA.className='emotion-aura active aura-'+emotion;
  clearTimeout(emotionAuraTimer);
  spawnEmotionParticles(emotion);
  emotionAuraTimer=setTimeout(hideEmotionAura,5000);
}

function spawnEmotionParticles(emotion) {

function autoWalk(){if(pet.state==='sleeping'||pet.isDragging)return;pet.targetX=Math.random()*(window.innerWidth-200)+10;pet.targetY=Math.random()*(window.innerHeight-300)+80;setState('walking');}
function updateWalk(){if(pet.state!=='walking'||pet.isDragging)return;const dx=pet.targetX-pet.x,dy=pet.targetY-pet.y,d=Math.sqrt(dx*dx+dy*dy);if(d<10){setState('idle');return;}pet.x+=(dx/d)*1.5;pet.y+=(dy/d)*1.5;C.style.transform=dx<0?'scaleX(-1)':'scaleX(1)';C.style.left=pet.x+'px';C.style.top=pet.y+'px';}
function blink(){if(['sleeping','jumping','playing','meowing'].includes(pet.state))return;document.querySelectorAll('.pet-eye').forEach(e=>{e.classList.add('blinking');setTimeout(()=>e.classList.remove('blinking'),200);});}
function decay(){if(pet.state==='sleeping'){pet.energy=Math.min(100,pet.energy+0.3);pet.hunger=Math.max(0,pet.hunger-0.05);}else{pet.hunger=Math.max(0,pet.hunger-0.08);pet.energy=Math.max(0,pet.energy-0.05);pet.happy=Math.max(0,pet.happy-0.03);}updateBars();}

function petReact(mood,action,duration){
  duration=duration||3500; clearMod();
  const moodMap={happy:['happy','happy-t'],sad:['sad','sad-t','sad-w'],excited:['excited','excited','happy-t','blushing'],love:['love','blushing','happy-t'],sleepy:['sleepy','sad-t'],hungry:['open','begging','happy-t'],curious:['open','listening'],shy:['sad','blushing']};
  const m=moodMap[mood]||moodMap.happy;
  setExpr(m[0]); m.slice(1).forEach(c=>C.classList.add(c));
  if(mood==='excited')spawnS(5); if(mood==='love')spawnH(8); if(mood==='shy')spawnSW();
  switch(action){
    case'wave':C.classList.add('waving','happy-t');setTimeout(()=>C.classList.remove('waving'),2000);break;
    case'jump':C.classList.add('jumping');setTimeout(()=>C.classList.remove('jumping'),600);break;
    case'beg':C.classList.add('begging');setTimeout(()=>C.classList.remove('begging'),3000);break;
    case'nod':PH.style.animation='headNod 0.8s ease-in-out 2';setTimeout(()=>PH.style.animation='',2000);break;
    case'shake':PH.style.animation='headShake 0.6s ease-in-out 2';setTimeout(()=>PH.style.animation='',1500);break;
    case'purr':C.classList.add('comforting','blushing');spawnH(5);break;
    case'eat':feedPet();return;
    case'sleep':letSleep();return;
    case'dance':{let b=0;const i=setInterval(()=>{C.classList.add('jumping');spawnS(3);spawnMN(2);setTimeout(()=>C.classList.remove('jumping'),500);b++;if(b>=3)clearInterval(i);},700);break;}
    case'sing':spawnMN(8);PH.style.animation='headNod 0.8s ease-in-out 3';setTimeout(()=>PH.style.animation='',3000);break;
    case'sit':C.classList.add('sitting');setTimeout(()=>C.classList.remove('sitting'),3000);break;
    case'lie':C.classList.add('lying');setTimeout(()=>C.classList.remove('lying'),4000);break;
    case'snuggle':C.classList.add('snuggling');setTimeout(()=>C.classList.remove('snuggling'),4000);break;
    case'roll':C.classList.add('rolling');setTimeout(()=>C.classList.remove('rolling'),2000);break;
    case'stretch':C.classList.add('stretching');setTimeout(()=>C.classList.remove('stretching'),2000);break;
    case'shakeFur':C.classList.add('shaking');setTimeout(()=>C.classList.remove('shaking'),1500);break;
  }
  setTimeout(()=>{clearMod();PH.style.animation='';if(pet.state!=='sleeping'&&pet.state!=='eating')setState('idle');},duration);
}

// OpenAI TTS 核心：通过REST API获取音频
function openaiTTSSpeak(text){
  return new Promise((resolve,reject)=>{
    if(!text||!text.trim()){resolve(null);return;}
    const clean=text.replace(/[💖💕✨🎉💤🐟🎾❤️😊😐😢😿🤔💪👋🎤💧♪♫♬🎵🌟🌸❄️🌧️🌊🌲🌅🌌🌤️☂️🛏️🪞🧶🍃📖🎮📝☀️💬🫂⬆️➤]/g,'').replace(/[喵咕噜吧唧~～！!？?。.，,、]{2,}/g,m=>m[0]).trim();
    if(!clean){resolve(null);return;}
    const body=JSON.stringify({
      model:openaiTTSModel,
      input:clean,
      voice:openaiTTSVoice,
      response_format:'mp3',
      speed:1.0
    });
    const timeout=setTimeout(()=>{reject(new Error('OpenAI TTS 超时'));},20000);
    fetch(openaiTTSBaseURL+'/audio/speech',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+openaiApiKey
      },
      body:body
    }).then(resp=>{
      clearTimeout(timeout);
      if(!resp.ok)throw new Error('OpenAI TTS HTTP '+resp.status);
      return resp.arrayBuffer();
    }).then(buf=>{
      if(buf&&buf.byteLength>0)resolve(buf);
      else resolve(null);
    }).catch(err=>{clearTimeout(timeout);reject(err);});
  });
}

// Edge TTS WebSocket 二进制消息头构造
function makeEdgeHeader(path){
  const p='Path:'+path;
  const ts='X-Timestamp:'+new Date().toISOString()+'Z';
  const cid='Content-Type:application/json; charset=utf-8';
  const hdr=p+'\r\n'+ts+'\r\n'+cid+'\r\n\r\n';
  const hdrBuf=new TextEncoder().encode(hdr);
  const pre=new ArrayBuffer(2);
  new DataView(pre).setUint16(0,hdrBuf.length);
  return concatBuf(pre,hdrBuf);
}
function makeEdgeAudioHeader(path){
  const p='Path:'+path;
  const ts='X-Timestamp:'+new Date().toISOString()+'Z';
  const ct='Content-Type:audio/mpeg';
  const hdr=p+'\r\n'+ts+'\r\n'+ct+'\r\n\r\n';
  const hdrBuf=new TextEncoder().encode(hdr);
  const pre=new ArrayBuffer(2);
  new DataView(pre).setUint16(0,hdrBuf.length);
  return concatBuf(pre,hdrBuf);
}
function concatBuf(a,b){
  const r=new Uint8Array(a.byteLength+b.byteLength);
  r.set(new Uint8Array(a),0);
  r.set(new Uint8Array(b),a.byteLength);
  return r.buffer;
}
function str2buf(s){return new TextEncoder().encode(s).buffer;}

// Edge TTS 核心：通过WebSocket获取音频
function edgeTTSSpeak(text){
  return new Promise((resolve,reject)=>{
    if(!text||!text.trim()){resolve(null);return;}
    const clean=text.replace(/[💖💕✨🎉💤🐟🎾❤️😊😐😢😿🤔💪👋🎤💧♪♫♬🎵🌟🌸❄️🌧️🌊🌲🌅🌌🌤️☂️🛏️🪞🧶🍃📖🎮📝☀️💬🫂⬆️➤]/g,'').replace(/[喵咕噜吧唧~～！!？?。.，,、]{2,}/g,m=>m[0]).trim();
    if(!clean){resolve(null);return;}
    const connId=Math.random().toString(36).substring(2,15);
    const wsUrl=EDGE_TTS_CONFIG.WSS_URL+'?TrustedClientToken='+EDGE_TTS_CONFIG.TOKEN+'&ConnectionId='+connId;
    let ws;
    try{ws=new WebSocket(wsUrl);}catch(e){reject(e);return;}
    const audioChunks=[];
    const timeout=setTimeout(()=>{try{ws.close();}catch(e){}reject(new Error('Edge TTS 超时'));},15000);
    ws.binaryType='arraybuffer';
    ws.onopen=()=>{
      // 1. 发送配置
      const cfgMsg=str2buf('X-Timestamp:'+new Date().toISOString()+'Z\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n{"context":{"synthesis":{"audio":{"metadataoptions":{"sentenceBoundaryEnabled":"false","wordBoundaryEnabled":"true"},"outputFormat":"audio-24khz-48kbitrate-mono-mp3"}}}}\r\n');
      ws.send(cfgMsg);
      // 2. 发送SSML
      const ssml='<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="zh-CN"><voice name="'+edgeTTSVoice+'"><prosody pitch="'+edgeTTSPitch+'" rate="'+edgeTTSRate+'">'+clean.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</prosody></voice></speak>';
      const ssmlMsg=str2buf('X-RequestId:'+connId+'\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:'+new Date().toISOString()+'Z\r\nPath:ssml\r\n\r\n'+ssml);
      ws.send(ssmlMsg);
    };
    ws.onmessage=(evt)=>{
      if(typeof evt.data==='string'){
        if(evt.data.includes('Path:turn.end')){clearTimeout(timeout);try{ws.close();}catch(e){}}
      }else{
        const arr=new Uint8Array(evt.data);
        if(arr.length>2){
          const hdrLen=new DataView(arr.buffer).getUint16(0);
          const hdrStr=new TextDecoder().decode(arr.slice(2,2+hdrLen));
          if(hdrStr.includes('Path:audio')&&hdrStr.includes('Content-Type:audio/mpeg')){
            const audioData=arr.slice(2+hdrLen);
            if(audioData.length>0)audioChunks.push(audioData);
          }
        }
      }
    };
    ws.onclose=()=>{
      clearTimeout(timeout);
      if(audioChunks.length>0){
        const totalLen=audioChunks.reduce((s,c)=>s+c.length,0);
        const merged=new Uint8Array(totalLen);
        let offset=0;
        for(const c of audioChunks){merged.set(c,offset);offset+=c.length;}
        resolve(merged.buffer);
      }else{resolve(null);}
    };
    ws.onerror=(e)=>{clearTimeout(timeout);reject(e);};
  });
}

// 播放Edge TTS音频
async function playEdgeAudio(audioBuf){
  if(!audioBuf)return;
  try{
    const blob=new Blob([audioBuf],{type:'audio/mpeg'});
    const url=URL.createObjectURL(blob);
    const audio=new Audio(url);
    audio.onplay=()=>{pet.isSpeaking=true;VW.classList.add('active');};
    audio.onended=()=>{pet.isSpeaking=false;VW.classList.remove('active');URL.revokeObjectURL(url);edgeIsPlaying=false;processAudioQueue();};
    audio.onerror=()=>{pet.isSpeaking=false;VW.classList.remove('active');URL.revokeObjectURL(url);edgeIsPlaying=false;processAudioQueue();};
    edgeIsPlaying=true;
    audio.play().catch(()=>{pet.isSpeaking=false;VW.classList.remove('active');edgeIsPlaying=false;processAudioQueue();});
  }catch(e){pet.isSpeaking=false;VW.classList.remove('active');edgeIsPlaying=false;}
}
function processAudioQueue(){
  if(edgeAudioQueue.length>0&&!edgeIsPlaying){
    const next=edgeAudioQueue.shift();
    playEdgeAudio(next);
  }
}

// 统一语音接口
let currentTTSEngine='edge'; // 'edge' | 'openai' | 'browser'
function petSpeak(text){
  if(!text)return;
  if(currentTTSEngine==='openai'&&openaiTTSEnabled&&openaiApiKey){
    openaiTTSSpeak(text).then(buf=>{
      if(buf){if(edgeIsPlaying){edgeAudioQueue.push(buf);}else{playEdgeAudio(buf);}}
      else{fallbackSpeak(text);}
    }).catch(()=>{fallbackSpeak(text);});
  }else if(currentTTSEngine==='edge'&&edgeTTSEnabled){
    edgeTTSSpeak(text).then(buf=>{
      if(buf){if(edgeIsPlaying){edgeAudioQueue.push(buf);}else{playEdgeAudio(buf);}}
      else{fallbackSpeak(text);}
    }).catch(()=>{fallbackSpeak(text);});
  }else{fallbackSpeak(text);}
}
function fallbackSpeak(text){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const clean=text.replace(/[💖💕✨🎉💤🐟🎾❤️😊😐😢😿🤔💪👋🎤💧♪♫♬🎵🌟🌸❄️🌧️🌊🌲🌅🌌🌤️☂️🛏️🪞🧶🍃📖🎮📝☀️💬🫂⬆️➤]/g,'').replace(/[喵咕噜吧唧~～！!？?。.，,、]{2,}/g,m=>m[0]).trim();
  if(!clean)return;
  const u=new SpeechSynthesisUtterance(clean);
  u.lang='zh-CN';u.rate=0.85;u.pitch=1.15;u.volume=0.75;
  const voices=window.speechSynthesis.getVoices();
  const preferred=voices.find(v=>v.lang.startsWith('zh')&&(v.name.includes('Xiaoxiao')||v.name.includes('Xiaoyi')||v.name.includes('female')||v.name.includes('女')));
  if(preferred)u.voice=preferred;
  u.onstart=()=>{pet.isSpeaking=true;VW.classList.add('active');};
  u.onend=()=>{pet.isSpeaking=false;VW.classList.remove('active');};
  window.speechSynthesis.speak(u);
}

const sceneTriggers = [
  {keywords:['星星','月亮','夜晚','星空','夜空','银河','流星','星座'],scene:'starry'},
  {keywords:['下雨','雨天','雨滴','暴雨','小雨','中雨','大雨','雷雨'],scene:'rain'},
  {keywords:['海','大海','海洋','游泳','潜水','沙滩','海边','水族馆'],scene:'ocean'},
  {keywords:['树','花','草','森林','树林','花园','草地','丛林','植物园'],scene:'forest'},
  {keywords:['累','困','晚安','睡觉','休息','午睡','打盹','好困','好累'],scene:'starry'},
  {keywords:['开心','快乐','生日','庆祝','派对','恭喜','节日','新年','圣诞'],scene:'sakura'},
  {keywords:['冷','雪','冬天','下雪','冰雪','寒冬','冻','雪花'],scene:'snow'},
];

function checkSceneTrigger(text) {
  const tl=text.toLowerCase();
  for (const trigger of sceneTriggers) {
    if (trigger.keywords.some(k=>tl.includes(k)) && trigger.scene!==currentBg) {
      const btn=document.querySelector('.scene-btn[data-bg="'+trigger.scene+'"]');
      switchBg(trigger.scene, btn);
      return trigger.scene;
    }
  }
  return null;
}

function processInput(text){
  addTyping();
  const delay=600+Math.random()*800;
  setTimeout(()=>{
    removeTyping();
    let response;
    switch(currentScene){
      case'free':response=handleFree(text);break;
      case'comfort':response=handleComfort(text);break;
      case'story':response=handleStory(text);break;
      case'game':response=handleGame(text);break;
      case'diary':response=handleDiary(text);break;
      case'daily':response=handleDaily(text);break;
      default:response=handleFree(text);
    }
    const emotion=detectEmotion(text);
    if(emotion) showEmotionAura(emotion);
    checkSceneTrigger(text);
    showBubble('');
    typeMessage(response.text,()=>{
      showBubble(response.text);
      petSpeak(response.text);
      petReact(response.mood,response.action,response.duration);
    });
  },delay);
}

let comfortStage=0;
function handleComfort(t){
  const tl=t.toLowerCase();
  const negativeWords=['难过','伤心','不开心','哭','难受','郁闷','烦','累','辛苦','压力大','焦虑','抑郁','孤独','寂寞','痛苦','绝望','崩溃','害怕','恐惧','委屈','不被理解','没人懂','失败','做不好','搞砸','出错','犯错','被骂','被批评','吵架','争吵','分手','失恋','离开','失去','去世','生病','不舒服','痛','受伤','欺负','嘲笑','看不起','自卑','没用','废物','讨厌自己','恨自己','想哭','忍不住','撑不住','好难','为什么我','不公平'];
  const hasNeg=negativeWords.some(w=>tl.includes(w));
  if(comfortStage===0){
    if(hasNeg){comfortStage=1;return r('我听到了...一定很辛苦吧。没关系，你不用假装坚强，在我面前可以想哭就哭。我会一直在这里陪着你的喵~','sad','purr',5000);}
    return r('嗯? 你想说什么都可以哦。如果你有不开心的地方，也可以告诉我，我会认真听的喵~','curious','nod');
  }
  if(comfortStage===1){
    if(hasNeg)return r('我理解你的感受...这些情绪都是正常的，不要责怪自己。你愿意跟我多说说具体发生了什么吗? 我会认真听的喵~','sad','comforting',5000);
    if(/好多了|好一点|谢谢你|感觉好|谢谢小云朵|有你真好/.test(tl)){comfortStage=0;return r('看到你心情好一点了，我真的很开心! 记住，不管什么时候你都可以来找我聊天。你永远不是一个人喵~','love','purr',5000);}
    return r('嗯嗯，我在听。你可以继续说，或者我们聊点别的转移一下注意力? 比如我可以给你讲个故事，或者我们玩个小游戏?','curious','nod',4000);
  }
  comfortStage=0;
  return r('谢谢你愿意跟我说这些。记住，难过的时候就来找我，我永远都在喵~','love','purr',5000);
}

function handleStory(t){
  const tl=t.toLowerCase();
  if(storyState==='idle'||storyState==='finished'){
    if(/冒险|刺激|勇敢|英雄/.test(tl)){currentStory=stories[0];storyState='telling';return startStory();}
    if(/温馨|温暖|感人|月亮|星星|浪漫/.test(tl)){currentStory=stories[1];storyState='telling';return startStory();}
    if(/励志|努力|梦想|小鱼|坚持/.test(tl)){currentStory=stories[2];storyState='telling';return startStory();}
    if(/什么故事|有什么故事|讲什么/.test(tl))return r('我有这些故事哦:\n1. 小云朵的冒险 (冒险)\n2. 月亮上的猫咪 (温馨)\n3. 勇敢的小鱼 (励志)\n\n告诉我你想听哪个喵~','happy','nod',4000);
    if(/自己编|随便|你决定/.test(tl)){currentStory=stories[~~(Math.random()*stories.length)];storyState='telling';return startStory();}
    return r('想听故事呀? 告诉我你想听什么类型的~ 冒险、温馨、还是励志的? 或者说一个关键词我帮你选喵~','curious','nod');
  }
  if(storyState==='telling'){
    if(/停|暂停|等一下|慢点/.test(tl))return r('好的，我先停一下。准备好了就说"继续"喵~','happy','nod');
    if(/继续|下一个|然后呢|接着讲/.test(tl))return continueStory();
    return r('嗯嗯，我在讲呢~ 等我讲完这段再说喵~','happy','nod');
  }
  return handleFree(t);
}

function startStory(){addMsg('system','📖 '+currentStory.title+' ('+currentStory.genre+')');return continueStory();}
function continueStory(){
  if(!currentStory)return r('嗯? 好像没有在讲故事呢。说"讲故事"开始吧喵~','curious','shake');
  if(currentStory.content.length===0){storyState='finished';return r('故事讲完啦! 喜欢吗? 想再听一个就说"讲故事"喵~','happy','wave');}
  const line=currentStory.content.shift();
  if(currentStory.content.length===0)storyState='finished';
  return {text:line,mood:line.includes('!')?'excited':line.includes('?')?'curious':line.includes('哭')?'sad':'happy',action:'nod',duration:3000};
}

    const ri=riddles.indexOf(currentRiddle);
    if(ri===-1){gameState='idle';return handleFree(t);}
    if(tl.includes(riddles[ri].a)||tl.includes('答案是'+riddles[ri].a)){riddleAnswered++;const nextRi=(ri+1)%riddles.length;currentRiddle=riddles[nextRi];return r('答对啦! 太厉害了! 你已经答对了 '+riddleAnswered+' 题喵! 🎉\n\n下一题: '+riddles[nextRi].q,'excited','jump',4000);}
    if(/提示|hint|不知道|猜不到/.test(tl))return r('提示: '+riddles[ri].hint+'\n\n再想想看喵~','curious','nod');
    if(/换题|下一题|跳过/.test(tl)){const nextRi=(ri+1)%riddles.length;currentRiddle=riddles[nextRi];return r('好吧，换一道! '+riddles[nextRi].q,'happy','nod');}
    if(/结束|不玩了|停止/.test(tl)){gameState='idle';currentRiddle=null;return r('游戏结束! 你一共答对了 '+riddleAnswered+' 题喵! 下次再来玩吧~','happy','wave');}
    return r('嗯...不太对哦，再想想看? 也可以说"提示"获取提示喵~','curious','shake');
  }
  return handleFree(t);
}

// ===== 场景五：心情日记 =====
// =============================================
let diaryEntries=[];
let diaryMood='neutral';

function handleDiary(t){
  const tl=t.toLowerCase();
  const happyWords=['开心','高兴','快乐','幸福','棒','好','太好了','成功','赢了','通过','完成','惊喜','兴奋','满足','感动','温暖','甜蜜','笑'];
  const sadWords=['难过','伤心','不开心','哭','难受','郁闷','烦','累','辛苦','失望','失败','做不好','搞砸','出错','吵架','争吵','分手','孤独','寂寞','焦虑','害怕','委屈'];
  const happyCount=happyWords.filter(w=>tl.includes(w)).length;
  const sadCount=sadWords.filter(w=>tl.includes(w)).length;
  if(happyCount>sadCount) diaryMood='happy'; else if(sadCount>happyCount) diaryMood='sad'; else diaryMood='neutral';
  diaryEntries.push({text:t,mood:diaryMood,time:new Date().toLocaleTimeString()});
  if(diaryMood==='happy'){pet.happy=Math.min(100,pet.happy+10);updateBars();if(t.includes('成功')||t.includes('通过')||t.includes('完成'))return r('哇! 太棒了! 我为你感到骄傲! 你的努力得到了回报喵~ 一定要好好庆祝一下!','excited','jump');return r('听起来今天很开心呀! 看到你高兴我也好开心! 这种快乐要好好珍惜哦喵~','love','purr',4000);}
  if(diaryMood==='sad'){pet.happy=Math.max(0,pet.happy-5);updateBars();return r('我听到你今天过得不太好...没关系的，明天会是新的一天。记住，不好的日子总会过去的。我会一直陪着你喵~','sad','purr',5000);}
  return r('嗯嗯，我记下来了! 今天是平凡的一天呢。平凡的日子也有它的美好，对吧? 喵~','happy','nod',3500);
}

// =============================================
// ===== 场景六：日常互动 =====
// =============================================
let idiomChain={active:false,lastChar:'',score:0};
const idioms=['一心一意','一帆风顺','一鸣惊人','一马当先','一诺千金','一见如故','一触即发','二话不说','三心二意','三顾茅庐','四面楚歌','五彩缤纷','五颜六色','六神无主','七上八下','八面玲珑','九牛一毛','十全十美','百发百中','千军万马','万紫千红','人山人海','天长地久','风和日丽','花好月圆','开天辟地','心想事成','马到成功','龙飞凤舞','虎虎生威','画龙点睛','守株待兔','亡羊补牢','掩耳盗铃','叶公好龙','刻舟求剑','井底之蛙','对牛弹琴','狐假虎威','拔苗助长','杯弓蛇影','画蛇添足','坐井观天','望梅止渴','胸有成竹','鹏程万里'];

function handleDaily(t){
  const tl=t.toLowerCase();
  if(/今天|几号|日期|星期几|周几/.test(tl)){const now=new Date();const days=['日','一','二','三','四','五','六'];return r('今天是 '+now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 星期'+days[now.getDay()]+' 喵~','happy','nod');}
  if(/天气|下雨|太阳|温度/.test(tl)){const w=['今天天气不错哦，阳光暖暖的~','今天有点阴天，不过不要紧~','外面好像要下雨了，记得带伞喵!','今天好热呀...想躲在空调房里~','今天凉凉的，适合窝在家里~'];return r(w[~~(Math.random()*w.length)],'happy','nod');}
  if(/成语|接龙|成语接龙/.test(tl)){if(!idiomChain.active){idiomChain.active=true;const si=~~(Math.random()*idioms.length);const s=idioms[si];idiomChain.lastChar=s[s.length-1];idiomChain.score=0;return r('成语接龙开始! 我先说: '+s+'\n\n你要接一个以"'+idiomChain.lastChar+'"开头的成语喵!','excited','wave',4000);}}
  if(idiomChain.active){
    const input=t.trim();
    if(input.length>=4&&idioms.includes(input)&&input[0]===idiomChain.lastChar){idiomChain.lastChar=input[input.length-1];idiomChain.score++;const canContinue=idioms.some(i=>i[0]===idiomChain.lastChar);if(canContinue)return r('接得好! '+input+'! 得 '+idiomChain.score+' 分了!\n\n继续! 接"'+idiomChain.lastChar+'"开头的成语喵~','excited','nod',3500);idiomChain.active=false;return r('太厉害了! 接不下去了! 你一共接了 '+idiomChain.score+' 个成语! 厉害喵~\n\n想再来一局就说"成语接龙"!','excited','jump',4500);}
    if(/结束|不玩了|停止/.test(tl)){idiomChain.active=false;return r('成语接龙结束! 你一共接了 '+idiomChain.score+' 个成语! 下次再来玩喵~','happy','wave');}
    return r('嗯...这个好像不是以"'+idiomChain.lastChar+'"开头的成语哦。再想想看? 或者说"结束"停止游戏喵~','curious','shake');
  }
  if(/提醒|记得|别忘了|通知/.test(tl))return r('好的我记住了! 不过我只是一只小猫咪，可能会忘记...你最好也自己记一下哦喵~','happy','nod');
  return handleFree(t);
}

// ===== 辅助函数 =====
function r(text,mood,action,duration){return {text,mood:mood||'happy',action:action||'idle',duration:duration||3500};}

// =============================================
// ===== 语音输入 =====
// =============================================
let voiceActive=false;
let recognition=null;
function toggleVoice(){
  if(voiceActive){stopVoice();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('浏览器不支持语音识别，请使用 Chrome');return;}
  recognition=new SR();recognition.lang='zh-CN';recognition.continuous=false;recognition.interimResults=true;
  recognition.onstart=()=>{voiceActive=true;document.getElementById('voice-btn').classList.add('recording');setState('listening');};
  recognition.onresult=e=>{const res=e.results[e.results.length-1];if(res.isFinal&&res[0].transcript.trim()){stopVoice();CI.value=res[0].transcript.trim();sendMessage();}};
  recognition.onerror=()=>{stopVoice();};
  recognition.onend=()=>{if(voiceActive)stopVoice();};
  try{recognition.start();}catch(e){}
}
function stopVoice(){voiceActive=false;if(recognition){recognition.stop();recognition=null;}document.getElementById('voice-btn').classList.remove('recording');}

window.addEventListener('resize',()=>{pet.x=Math.min(pet.x,window.innerWidth-180);pet.y=Math.min(pet.y,window.innerHeight-200);C.style.left=pet.x+'px';C.style.top=pet.y+'px';});

// ===== 初始化 =====
// 初始化语音设置面板
(function initVoicePanel(){
  // Edge TTS 声音列表
  const sel=document.getElementById('voice-select');
  if(sel){
    EDGE_TTS_CONFIG.voices.forEach(v=>{
      const opt=document.createElement('option');
      opt.value=v.id;
      opt.textContent=v.name+(v.tag?' ('+v.tag+')':'');
      sel.appendChild(opt);
    });
  }
  // OpenAI TTS 声音列表
  const oSel=document.getElementById('openai-voice-select');
  if(oSel){
    OPENAI_TTS_CONFIG.voices.forEach(v=>{
      const opt=document.createElement('option');
      opt.value=v.id;
      opt.textContent=v.name+(v.tag?' ('+v.tag+')':'');
      oSel.appendChild(opt);
    });
  }
  // 从localStorage恢复设置
  loadVoiceSettings();
})();

function loadVoiceSettings(){
  try{
    const s=JSON.parse(localStorage.getItem('pet_voice_settings')||'{}');
    if(s.engine){currentTTSEngine=s.engine;switchEngineUI(s.engine);}
    if(s.openaiApiKey){openaiApiKey=s.openaiApiKey;const ki=document.getElementById('openai-key-input');if(ki)ki.value=s.openaiApiKey;}
    if(s.openaiBaseURL){openaiTTSBaseURL=s.openaiBaseURL;const bi=document.getElementById('openai-base-url');if(bi)bi.value=s.openaiBaseURL;}
    if(s.openaiModel){openaiTTSModel=s.openaiModel;const mi=document.getElementById('openai-model-select');if(mi)mi.value=s.openaiModel;}
    if(s.openaiVoice){openaiTTSVoice=s.openaiVoice;const vi=document.getElementById('openai-voice-select');if(vi)vi.value=s.openaiVoice;}
    if(s.edgeVoice){edgeTTSVoice=s.edgeVoice;const ev=document.getElementById('voice-select');if(ev)ev.value=s.edgeVoice;}
  }catch(e){}
}
function saveVoiceSettings(){
  try{
    localStorage.setItem('pet_voice_settings',JSON.stringify({
      engine:currentTTSEngine,
      openaiApiKey:openaiApiKey,
      openaiBaseURL:openaiTTSBaseURL,
      openaiModel:openaiTTSModel,
      openaiVoice:openaiTTSVoice,
      edgeVoice:edgeTTSVoice
    }));
  }catch(e){}
}

function switchEngine(engine){
  currentTTSEngine=engine;
  switchEngineUI(engine);
  saveVoiceSettings();
}
function switchEngineUI(engine){
  const engines=['edge','openai','browser'];
  const panels={edge:'edge-settings',openai:'openai-settings',browser:'browser-settings'};
  engines.forEach(e=>{
    const btn=document.getElementById('engine-'+e);
    if(btn){
      if(e===engine){btn.style.borderColor='#5aabb8';btn.style.background='#5aabb8';btn.style.color='white';}
      else{btn.style.borderColor='#ddd';btn.style.background='white';btn.style.color='#666';}
    }
    const p=document.getElementById(panels[e]);
    if(p)p.style.display=e===engine?'block':'none';
  });
}

function toggleVoicePanel(){
  const p=document.getElementById('voice-panel');
  p.style.display=p.style.display==='none'?'block':'none';
}
